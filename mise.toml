# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.19"

[tools]
hk = "2.13.0"
bun = "1.4.5"
node = "26.13.1"
"npm:semantic-release" = "26.0.1"
oxlint = "1.73.0"
oxfmt = "0.75.0"
jactionlint = "v2.6.0"
# required for jactionlint
shellcheck = "0.11.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
tombi = "1.11.3"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.13.9"
yamllint = "1.38.0"
"npm:renovate" = "44.253.0"
typos = "1.52.2"
json5 = "2.2.3"
"npm:typescript" = "7.0.2"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
experimental = true
auto_install_disable_tools = ["npm:renovate"]

[settings.npm]
package_manager = "bun"

[task_config]
includes = ["tasks.toml"]

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[hooks]
postinstall = """
{% if env.CI is undefined %}
  hk install --mise
{% endif %}
"""
