# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

[tools]
hk = "2.10.0"
bun = "1.4.4"
node = "26.13.0"
"npm:semantic-release" = "25.0.9"
oxlint = "1.73.0"
oxfmt = "0.75.0"
jactionlint = "v2.4.0"
# required for jactionlint
shellcheck = "0.11.0"
ghalint = "1.5.7"
pinact = "5.0.2"
zizmor = "1.31.1"
tombi = "1.9.8"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.13.6"
yamllint = "1.38.0"
"npm:renovate" = "44.198.2"
typos = "1.51.1"
json5 = "2.2.3"
"npm:typescript" = "7.0.2"

[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "macos-arm64"]
experimental = true
auto_install_disable_tools = ["npm:renovate"]

[settings.npm]
package_manager = "bun"

[task_config]
includes = ["tasks.toml"]

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[hooks]
postinstall = """
{% if env.CI is undefined %}
  hk install --mise
{% endif %}
"""
