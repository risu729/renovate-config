# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
hk = "1.56.0"
bun = "1.4.0"
node = "26.7.0"
"npm:semantic-release" = "25.0.9"
oxlint = "1.73.0"
oxfmt = "0.64.0"
actionlint = "1.7.12"
# required for actionlint
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
tombi = "1.2.10"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.12.5"
yamllint = "1.38.0"
"npm:renovate" = "44.34.3"
typos = "1.49.0"
json5 = "2.2.3"
"npm:typescript" = "7.0.2"

[settings]
experimental = true
auto_install_disable_tools = ["npm:renovate"]

[settings.npm]
package_manager = "bun"

[task_config]
includes = ["tasks.toml"]

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[hooks]
postinstall = """
{% if env.CI is undefined %}
  hk install --mise
{% endif %}
"""
